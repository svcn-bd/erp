<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — SVCN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f6fc; --card:#ffffff;
    --blue:#2f7de1; --blue-soft:#eaf2fd; --blue-deep:#1c5bb0;
    --teal:#12a894; --teal-soft:#e2f7f4;
    --text-hi:#151a23; --text-mid:#6b7686; --text-lo:#9aa4b2; --border:#e7ebf1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);font-family:'Inter',sans-serif;color:var(--text-hi);
    position:relative;overflow:hidden;
  }
  .hero-band{position:absolute;top:0;left:0;right:0;height:220px;
    background:linear-gradient(120deg,#dcebfd,#e2f7f4 55%,#f2f6fc 100%);
    border-bottom:1px solid var(--border);}
  .card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:40px 36px;max-width:420px;width:calc(100% - 32px);
    text-align:center;box-shadow:0 12px 32px rgba(21,26,35,.08);}
  .brand-mark{width:56px;height:56px;border-radius:50%;overflow:hidden;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--blue),var(--teal));
    box-shadow:0 6px 18px rgba(28,91,176,.25);}
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-mark .fallback{color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:56px;
    background:linear-gradient(135deg,var(--blue),var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin:0;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin:6px 0 8px;}
  p{color:var(--text-mid);font-size:13.5px;line-height:1.6;margin:0 0 26px;}
  .links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn{border:none;font-weight:600;font-size:13px;padding:11px 18px;border-radius:10px;
    cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
    transition:transform .15s ease, box-shadow .15s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;
    box-shadow:0 6px 16px rgba(47,125,225,.28);}
  .btn-ghost{background:var(--blue-soft);color:var(--blue-deep);}
  .hint{margin-top:22px;font-size:11.5px;color:var(--text-lo);}
</style>
</head>
<body>
<div class="hero-band"></div>
<div class="card">
  <div class="brand-mark">
    <img src="svcn-logo.png" alt="SVCN logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'SV'}))">
  </div>
  <p class="code">404</p>
  <h1>This page took a wrong turn</h1>
  <p>The page you're looking for doesn't exist — it may have been moved, or the link's a little off. Here's where you probably meant to go:</p>
  <div class="links">
    <a class="btn btn-primary" href="/erp.html">Open ERP</a>
    <a class="btn btn-ghost" href="/portal.html">Open Portal</a>
  </div>
  <p class="hint">Satellite Vision Cable Network</p>
</div>
</body>
</html>
